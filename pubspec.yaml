name: aware
description: AWARE - Advanced Warning & Analytics for Risk & Emergencies. Department of Disaster Management (DDM), MoDMR, Bangladesh.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management & routing
  get: ^4.6.6

  # Networking
  http: ^1.2.2
  connectivity_plus: ^6.0.5

  # Offline database (Floor)
  floor: ^1.5.0
  sqflite: ^2.3.3

  # Local storage (single gateway: UserPrefService)
  shared_preferences: ^2.3.2

  # Location
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # Notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  # Accessibility - read notifications aloud (BMD notification page parity)
  flutter_tts: ^4.2.0

  # UI
  flutter_screenutil: ^5.9.3
  carousel_slider: ^5.1.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  video_player: ^2.9.2
  lottie: ^3.1.3
  webview_flutter: ^4.13.1

  # Incident report image upload
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  nsfw_detector_flutter: ^2.0.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  floor_generator: ^1.5.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/videos/
    - assets/lottie/
    - assets/day.jpg
    - assets/night.jpg
    - assets/svg/
    - assets/json/
    - assets/video/

  # AnekBangla bundled locally -> no async font flash (BMD lesson)
  fonts:
    - family: AnekBangla
      fonts:
        - asset: assets/fonts/AnekBangla-Regular.ttf
        - asset: assets/fonts/AnekBangla-Medium.ttf
          weight: 500
        - asset: assets/fonts/AnekBangla-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AnekBangla-Bold.ttf
          weight: 700
